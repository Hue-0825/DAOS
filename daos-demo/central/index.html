<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAOS 메인 서버</title><link rel="stylesheet" href="style.css?v=24"><script type="module" src="central.mjs?v=25"></script></head>
<body><header><strong>DAOS 메인 서버</strong><span id="server-state" class="server-state" role="status">서버 확인 중</span></header><main>
<div class="intro"><h1>메인 관제센터</h1></div>
<nav class="card service-nav" aria-label="DAOS 운영 웹">
  <strong>DAOS 운영 웹</strong>
  <div>
    <a href="./" aria-current="page">메인 관제센터</a>
    <a href="https://daos-logistics.ryker6365.chatgpt.site/open/shop">스토어 ↗</a>
    <a href="https://daos-logistics.ryker6365.chatgpt.site/open/hub">지역 허브 ↗</a>
    <a href="https://daos-logistics.ryker6365.chatgpt.site/open/driver">기사 앱 ↗</a>
    <a href="https://daos-logistics.ryker6365.chatgpt.site/open/robot">로봇 관제실 ↗</a>
    <a href="https://daos-logistics.ryker6365.chatgpt.site/operations.html">통합 사이트 ↗</a>
  </div>
</nav>
<section class="card reset-panel" aria-label="서버 연결 제어"><strong>작업 서버 연결</strong><button id="connection-toggle" type="button" disabled>서버 연결 끊기</button><p id="connection-result" role="status"></p></section>
<section class="card central-kpis" aria-label="현재 운행일 배송 현황">
  <div><span>운행일 접수</span><strong id="kpi-orders">—</strong></div>
  <div><span>배차 확정</span><strong id="kpi-assigned">—</strong></div>
  <div><span>서버 확인 배송</span><strong id="kpi-delivered">—</strong></div>
</section>
<section class="card reset-panel" aria-label="전체 시연 초기화"><div><strong>전체 시연 초기화</strong><p>기본 주문 300건을 배차 대기로 되돌리고 모든 허브와 기사 앱의 배송 기록을 초기화합니다.</p></div><button id="reset-demo" type="button" disabled>전체 시연 리셋</button><p id="reset-result" role="status"></p></section>
<details class="card clock-panel"><summary>시간 설정 <span id="shared-clock">시연 시간 확인 중</span></summary><form id="clock-form" class="toolbar"><label>시연 날짜<select id="clock-date" required></select></label><label>시연 시각<input id="clock-time" type="time" required></label><button id="clock-apply" type="submit" disabled>연결된 화면에 적용</button></form><p id="clock-result" role="status"></p></details>
<section class="card"><div class="tabs" aria-label="주문 보기"><button id="all" type="button" aria-pressed="true">모든 정보</button><button id="regional" type="button" aria-pressed="false">지역별 정리</button></div>
<div id="regional-panel" class="toolbar" hidden><label>시·도 허브<select id="province"></select></label><p id="region-note"></p></div>
<div class="toolbar"><label class="history">배송일<select id="history-date"><option value="all">전체 배송일</option></select></label>
<label class="history">배송 시간대<select id="history-slot"><option value="all">전체 시간대</option><option value="0">06:00–12:00</option><option value="1">12:00–18:00</option><option value="2">18:00–24:00</option></select></label></div>
<div id="release-panel" hidden><button id="release-date" type="button"></button><p id="release-result" role="status"></p></div>
<p id="count" role="status"></p><p id="validation-summary"></p>
<div class="sheet-scroll" role="region" aria-label="메인 서버 주문 원장" tabindex="0"><table><thead><tr><th>접수 번호</th><th>접수·배송일</th><th>고객</th><th>상품</th><th>주소·인계</th><th>담당 허브</th><th>상태</th></tr></thead><tbody id="orders"></tbody></table></div>
</section></main></body></html>
