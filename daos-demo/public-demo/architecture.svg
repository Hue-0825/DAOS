<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
  <title id="title">DAOS 중앙·엣지·로봇 3계층 구조</title>
  <desc id="desc">중앙에서 주문을 받아 작업과 통로 권한을 발급한다. 구역 엣지는 로봇과 권한과 기록을 주고받는다. 복구 후 중앙은 현장 기록과 위치 증거를 대조해 확정 상태와 새 운전 세대를 관제에 반영한다.</desc>
  <defs>
    <marker id="ink" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#4b606b"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28634f"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#326482"/></marker>
    <marker id="brown" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#87552d"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,sans-serif;fill:#1c3039}
      .title{font-size:25px;font-weight:800}.note{font-size:17px}.name{font-size:21px;font-weight:750}.sub{font-size:17px;fill:#4e6169}
      .link{font-size:16px;font-weight:750;paint-order:stroke;stroke-width:7;stroke-linejoin:round}
      .wire{fill:none;stroke-width:2.5}.node{fill:#fffefa;stroke:#8397a2;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1280" height="570" fill="#fffefa"/>
  <rect x="18" y="18" width="1244" height="164" rx="9" fill="#e8eff3" stroke="#9db3c0"/>
  <rect x="18" y="219" width="1244" height="140" rx="9" fill="#e9f0e8" stroke="#a4b9a7"/>
  <rect x="18" y="396" width="1244" height="155" rx="9" fill="#f5ede2" stroke="#c5af92"/>
  <g>
    <text class="title" x="43" y="62">01 중앙</text><text class="note" x="43" y="87">계획과 최종 확인</text>
    <text class="title" x="43" y="268">02 구역 엣지</text><text class="note" x="43" y="293">창고 안의 현장 장치</text>
    <text class="title" x="43" y="448">03 로봇</text><text class="note" x="43" y="473">판단하고 작업 실행</text>
  </g>
  <g class="wire" stroke="#4b606b" marker-end="url(#ink)">
    <path d="M420 115H454"/><path d="M662 115H698"/>
  </g>
  <path class="wire" d="M1104 79V44H554V78" stroke="#326482" marker-end="url(#blue)"/>
  <text class="link" x="826" y="48" text-anchor="middle" fill="#326482" stroke="#e8eff3">확정 상태와 새 운전 세대 반영</text>
  <g class="wire" stroke="#28634f" marker-end="url(#green)">
    <path d="M795 153V211H760V253"/>
    <path d="M866 255V224H1061V154"/>
    <path d="M1150 254V154"/>
  </g>
  <text class="link" x="681" y="206" stroke="#fffefa">작업·통로 권한 전달</text>
  <text class="link" x="900" y="216" stroke="#fffefa">복구 시 로그 전송</text>
  <text class="link" x="1164" y="206" stroke="#fffefa">위치 대조</text>
  <g class="wire" stroke="#87552d" marker-start="url(#brown)" marker-end="url(#brown)">
    <path d="M579 324V372H348V438"/>
    <path d="M725 324V438"/>
    <path d="M846 324V372H1087V438"/>
    <path d="M470 480H600" stroke-dasharray="5 4"/>
    <path d="M846 480H966" stroke-dasharray="5 4"/>
  </g>
  <text class="link" x="742" y="387" stroke="#fffefa">구역 사용 확인 · 작업 기록 전달</text>
  <text class="link" x="650" y="536" text-anchor="middle" stroke="#f5ede2">점선 · 보고서의 로봇 간 점유권 협상</text>
  <g text-anchor="middle">
    <rect class="node" x="222" y="79" width="198" height="74" rx="5"/><text class="name" x="321" y="110">주문·재고 관리</text><text class="sub" x="321" y="134">WMS</text>
    <rect class="node" x="455" y="79" width="207" height="74" rx="5"/><text class="name" x="558" y="110">로봇 배정·경로 계획</text><text class="sub" x="558" y="134">중앙관제 FMS/MCS</text>
    <rect class="node" x="699" y="79" width="207" height="74" rx="5"/><text class="name" x="802" y="110">통로 사용 권한 발급</text><text class="sub" x="802" y="134">점유권 위임 관리자</text>
    <rect class="node" x="992" y="79" width="228" height="74" rx="5"/><text class="name" x="1106" y="110">복구 기록 대조</text><text class="sub" x="1106" y="134">복구 대조 엔진</text>
    <rect class="node" x="457" y="255" width="459" height="69" rx="5"/><text class="name" x="686" y="284">구역 게이트웨이</text><text class="sub" x="686" y="307">MQTT 중계 · 로봇 로그 복제 · 시각 동기화</text>
    <rect class="node" x="992" y="255" width="228" height="69" rx="5"/><text class="name" x="1106" y="284">실물 위치 증거</text><text class="sub" x="1106" y="307">로봇 카메라 · 작업자 PDA</text>
    <rect class="node" x="223" y="439" width="247" height="76" rx="5"/><text class="name" x="346" y="471">로봇 1</text><text class="sub" x="346" y="494">실행 판단(DRG) · 로컬 로그</text>
    <rect class="node" x="600" y="439" width="246" height="76" rx="5"/><text class="name" x="723" y="471">로봇 2</text><text class="sub" x="723" y="494">실행 판단(DRG) · 로컬 로그</text>
    <rect class="node" x="967" y="439" width="246" height="76" rx="5"/><text class="name" x="1090" y="471">로봇 N</text><text class="sub" x="1090" y="494">실행 판단(DRG) · 로컬 로그</text>
  </g>
</svg>
